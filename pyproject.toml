[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openvpn3-kde-nm"
version = "1.1.1"
description = "Native KDE Connection Manager (plasma-nm / NetworkManager) integration for OpenVPN 3 Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "German Rosales", email = "rosalesgermane@gmail.com" }
]
keywords = ["openvpn3", "kde", "plasma-nm", "networkmanager", "vpn", "cloudconnexa", "linux"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: KDE",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/gerosalesc/openvpn3-kde-nm"
Repository = "https://github.com/gerosalesc/openvpn3-kde-nm"
Issues = "https://github.com/gerosalesc/openvpn3-kde-nm/issues"
Changelog = "https://github.com/gerosalesc/openvpn3-kde-nm/blob/main/CHANGELOG.md"

[project.scripts]
nm-openvpn3-service = "openvpn3_kde_nm.nm_vpn_service:main"
openvpn3-kde-sync = "openvpn3_kde_nm.session_watcher:main"
openvpn3-kde-cli = "openvpn3_kde_nm.cli:main"

[tool.setuptools.packages.find]
include = ["openvpn3_kde_nm*"]

[tool.setuptools.package-data]
openvpn3_kde_nm = ["data/*"]
